[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-base"
version = "0.1.0"
description = "Local-first literature collection and material access for research agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "typer>=0.12,<1", "PyYAML>=6,<7", "pypdf>=5,<7", "python-dotenv>=1,<2", "bibtexparser>=1.4,<2"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
research-base = "research_base.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: requires explicit network access"]

